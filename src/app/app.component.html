<div class="shell">
  <header class="topbar">
    <span class="logo" aria-hidden="true"></span>
    <h1>{{ titulo }}</h1>
    <p class="received">Estado recibido: <strong>PERSIANA {{ this.blindState }}</strong></p>
  </header>

  <section class="panel">
    <div class="control">
      <span class="icon bolt" aria-hidden="true"></span>
      <div class="text">
        <span class="name">Corriente General:</span>
        <strong [class.on]="this.powerOutage" [class.off]="!this.powerOutage">{{ this.powerOutage ? 'CONECTADA' : 'DESCONECTADA' }}</strong>
      </div>
      <button [class.danger]="this.powerOutage" (click)="onConnectDisconnect()">{{ this.powerOutage ? 'Desconectar' : 'Conectar' }}</button>
    </div>

    <div class="control">
      <span class="icon bolt" aria-hidden="true"></span>
      <div class="text">
        <span class="name">Corriente Habitación:</span>
        <strong [class.on]="this.roomOutage" [class.off]="!this.roomOutage">{{ this.roomOutage ? 'CONECTADA' : 'DESCONECTADA' }}</strong>
      </div>
      <button [class.danger]="this.roomOutage" (click)="onRoomConnectDisconnect()">{{ this.roomOutage ? 'Desconectar' : 'Conectar' }}</button>
    </div>
  </section>

  <app-room [powerOutage]="this.powerOutage" [roomOutage]="this.roomOutage" (blindStateOutput)="onBlindStateChange($event)"></app-room>
</div>
